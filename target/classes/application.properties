spring.application.name=WebsocketProject

# SERVER
server.port=${PORT:8080}
server.address=0.0.0.0

# DATABASE
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/websocket_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# JWT
jwt.secret=${JWT_SECRET:my-super-secret-key-for-websocket-project-2026}

# SPRING SECURITY
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin123}
spring.security.user.roles=USER



# SPRINGDOC / SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB